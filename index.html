<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>きのこ図鑑</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:        #111;
  --ink-soft:   #555;
  --ink-mute:   #999;
  --line:       #e8e8e8;
  --bg:         #fafafa;
  --white:      #fff;
  --green:      #2a6e2a;
  --green-pale: #edf5ed;
  --red:        #b82020;
  --red-pale:   #fdf0f0;
  --amber:      #c06010;
  --amber-pale: #fef6ee;
  --gray-pale:  #f3f3f3;
  --radius-sm:  6px;
  --radius:     12px;
  --radius-lg:  18px;
  --font:       'Zen Kaku Gothic New', sans-serif;
  --top-safe:   env(safe-area-inset-top, 0px);
  --bot-safe:   env(safe-area-inset-bottom, 0px);
}

html { font-size: 16px; background: var(--bg); }

body {
  font-family: var(--font);
  color: var(--ink);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

/* ─── Shell ─── */
#app {
  max-width: 640px;
  margin: 0 auto;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--white);
  box-shadow: 0 0 0 1px var(--line);
}

/* ─── Header ─── */
.hd {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding-top: var(--top-safe);
}

.hd-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 12px 16px 8px;
}

.hd-logo {
  font-size: 19px;
  font-weight: 900;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.hd-logo em {
  font-style: normal;
  color: var(--green);
}

.hd-count {
  font-size: 12px;
  color: var(--ink-mute);
  letter-spacing: 0.04em;
}

/* ─── Search ─── */
.search-row {
  padding: 0 12px 8px;
}

.search-inner {
  position: relative;
  display: flex;
  align-items: center;
}

.search-ico {
  position: absolute;
  left: 12px;
  color: var(--ink-mute);
  pointer-events: none;
  flex-shrink: 0;
}

.search-input {
  width: 100%;
  height: 42px;
  padding: 0 38px 0 38px;
  border: 1.5px solid var(--line);
  border-radius: 21px;
  font-family: var(--font);
  font-size: 15px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
  -webkit-appearance: none;
  transition: border-color .15s, background .15s;
}

.search-input::placeholder { color: var(--ink-mute); }
.search-input:focus { border-color: var(--green); background: var(--white); }

.search-x {
  position: absolute;
  right: 8px;
  display: none;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--ink-mute);
  border: none;
  color: #fff;
  font-size: 12px;
  cursor: pointer;
  line-height: 1;
}
.search-x.on { display: flex; }

/* ─── Chips ─── */
.chips-wrap {
  padding: 0 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.chips-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chips-row::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  height: 32px;
  padding: 0 13px;
  border-radius: 16px;
  border: 1.5px solid var(--line);
  background: var(--white);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all .14s;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.chip:active { opacity: .75; }

.chip.on-s  { background: var(--green);      border-color: var(--green);  color: #fff; }
.chip.on-d0 { background: var(--ink-soft);   border-color: var(--ink-soft); color: #fff; }
.chip.on-d1 { background: var(--red);        border-color: var(--red);    color: #fff; }
.chip.on-d2 { background: var(--amber);      border-color: var(--amber);  color: #fff; }
.chip.on-d3 { background: #5a7a5a;           border-color: #5a7a5a;       color: #fff; }

/* ─── List ─── */
#list-view {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.list-body {
  padding: 10px 12px 32px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

/* ─── Card ─── */
.card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 12px 11px 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--white);
  cursor: pointer;
  transition: box-shadow .15s, transform .1s;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.card:active { transform: scale(.985); box-shadow: 0 2px 10px rgba(0,0,0,.08); }

/* 左端の毒性アクセントバー */
.card .card-accent {
  display: block;
  flex-shrink: 0;
  width: 4px;
  align-self: stretch;
  min-height: 68px;
}
.card-accent-毒      { background: var(--red); }
.card-accent-毒の疑い { background: var(--amber); }
.card-accent-食用不明 { background: #7aaa7a; }

.card-photo {
  width: 68px; height: 68px;
  border-radius: 8px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--gray-pale);
}
.card-photo-ph {
  width: 68px; height: 68px;
  border-radius: 8px;
  background: linear-gradient(135deg, #e8f0e8, #d8e8d8);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; flex-shrink: 0;
  border: 1px solid #d0e4d0;
}

.card-info { flex: 1; min-width: 0; padding-right: 4px; }
.card-name {
  font-size: 17px; font-weight: 700;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.card-sci {
  font-size: 10px; color: var(--ink-mute); font-style: italic;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 6px;
}
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }

/* ─── Tags ─── */
.tag {
  display: inline-flex; align-items: center;
  height: 20px; padding: 0 7px;
  border-radius: 10px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.tag-毒      { background: var(--red-pale);   color: var(--red);   border: 1px solid #f0c0c0; }
.tag-毒の疑い { background: var(--amber-pale); color: var(--amber); border: 1px solid #f0d8b0; }
.tag-食用不明 { background: #eef4ee;           color: #4a7a4a;      border: 1px solid #c8dcc8; }
.tag-season  { background: var(--green-pale); color: var(--green); }

/* ─── Empty ─── */
.empty {
  padding: 64px 24px;
  text-align: center;
  color: var(--ink-mute);
}
.empty-ico { font-size: 44px; margin-bottom: 10px; }
.empty-txt { font-size: 15px; }

/* ─── Detail panel ─── */
#detail {
  position: fixed; inset: 0;
  background: var(--white);
  z-index: 200;
  display: flex; flex-direction: column;
  max-width: 640px;
  left: 50%; transform: translateX(calc(-50% + 100vw));
  width: 100%;
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
#detail.open { transform: translateX(-50%); }

.dt-hd {
  position: sticky; top: 0; z-index: 10;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  padding-top: var(--top-safe);
}
.dt-hd-inner {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
}
.dt-back {
  display: flex; align-items: center; gap: 3px;
  background: none; border: none;
  font-family: var(--font); font-size: 15px; font-weight: 500;
  color: var(--green); cursor: pointer;
  padding: 6px 0; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.dt-back:active { opacity: .7; }
.dt-hd-name {
  font-size: 17px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--ink);
}

.dt-scroll {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(24px + var(--bot-safe));
}

.dt-hero {
  width: 100%; aspect-ratio: 4/3;
  object-fit: cover; display: block;
  background: var(--gray-pale);
}
.dt-hero-ph {
  width: 100%; aspect-ratio: 4/3;
  background: var(--gray-pale);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
}

.dt-body { padding: 22px 16px 8px; }

.dt-name {
  font-size: 28px; font-weight: 900;
  letter-spacing: -0.02em; color: var(--ink);
  margin-bottom: 4px;
}
.dt-sci {
  font-size: 13px; color: var(--ink-mute); font-style: italic;
  margin-bottom: 14px;
}
.dt-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 22px; }
.dt-tag {
  height: 26px; padding: 0 11px; border-radius: 13px;
  font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center;
}

/* ─── Detail sections ─── */
.sec { margin-bottom: 22px; }
.sec-ttl {
  font-size: 13px; font-weight: 700;
  letter-spacing: .04em; color: var(--ink-soft);
  margin-bottom: 10px;
  padding-bottom: 7px;
  border-bottom: 2px solid var(--line);
}
.sec-body {
  font-size: 15px; color: var(--ink);
  line-height: 1.85;
}

.check-ul { list-style: none; }
.check-ul li {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 9px 0;
  font-size: 14px; color: var(--ink); line-height: 1.65;
  border-bottom: 1px solid var(--line);
}
.check-ul li:last-child { border-bottom: none; }

.chk {
  flex-shrink: 0;
  width: 18px; height: 18px; margin-top: 2px;
  border-radius: 50%;
  background: var(--green-pale);
  display: flex; align-items: center; justify-content: center;
}
.chk svg {
  width: 10px; height: 10px;
  stroke: var(--green); stroke-width: 2.5;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}

.alert {
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 14px; line-height: 1.7;
  margin-bottom: 8px;
}
.alert:last-child { margin-bottom: 0; }
.alert-lbl {
  font-size: 11px; font-weight: 700;
  letter-spacing: .05em; display: block; margin-bottom: 4px;
}
.alert-warn  { background: var(--amber-pale); border-left: 3px solid var(--amber); color: #6a3800; }
.alert-warn .alert-lbl  { color: var(--amber); }
.alert-toxic { background: var(--red-pale);   border-left: 3px solid var(--red);   color: #6a1010; }
.alert-toxic .alert-lbl { color: var(--red); }

/* ─── Swipe hint ─── */
@media (pointer: coarse) {
  .dt-scroll { scroll-padding-top: 0; }
}

/* ─── Desktop polish ─── */
@media (min-width: 640px) {
  #app { border-radius: 0; }
  #list-view::-webkit-scrollbar,
  .dt-scroll::-webkit-scrollbar { width: 3px; }
  #list-view::-webkit-scrollbar-thumb,
  .dt-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header class="hd" id="hd">
    <div class="hd-top">
      <div class="hd-logo">🍄 <em>きのこ</em>図鑑</div>
      <div class="hd-count" id="count"></div>
    </div>

    <div class="search-row">
      <div class="search-inner">
        <svg class="search-ico" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="q" class="search-input" type="search"
          placeholder="名前で検索（例：タマゴ）"
          autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="qx" class="search-x" aria-label="クリア">✕</button>
      </div>
    </div>

    <div class="chips-wrap">
      <div class="chips-row" id="season-row">
        <button class="chip on-s" data-s="all">すべての季節</button>
        <button class="chip" data-s="春">🌸 春</button>
        <button class="chip" data-s="夏">🌿 夏</button>
        <button class="chip" data-s="秋">🍂 秋</button>
        <button class="chip" data-s="冬">❄️ 冬</button>
      </div>
      <div class="chips-row" id="danger-row">
        <button class="chip on-d0" data-d="all">すべての区分</button>
        <button class="chip" data-d="毒">☠️ 毒</button>
        <button class="chip" data-d="毒の疑い">⚠️ 毒の疑い</button>
        <button class="chip" data-d="食用不明">❓ 食用不明</button>
      </div>
    </div>
  </header>

  <!-- List -->
  <main id="list-view">
    <div class="list-body" id="list-body"></div>
  </main>

  <!-- Detail -->
  <div id="detail" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="dt-hd">
      <div class="dt-hd-inner">
        <button class="dt-back" id="back-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          一覧
        </button>
        <span class="dt-hd-name" id="dt-hd-name"></span>
      </div>
    </div>
    <div class="dt-scroll" id="dt-scroll"></div>
  </div>

</div>
<script>
// ─── Data ───────────────────────────────────────────────────────────────────
const DATA = [
  {id:"matsutake",name:"マツタケ",sci:"Tricholoma matsutake",
   danger:"食用不明",season:["秋"],
   desc:"日本の秋を代表する高級食用きのこ。独特の強い芳香が特徴。アカマツ林の地上に発生。人工栽培は不可能で近年は国産が激減している。",
   id_pts:["傘は薄茶色の繊維状、幼菌時は縁が強く内側に巻く","独特の強い芳香（松と土が混ざったような香り）","ひだは白色・密・細かい","柄は太く白〜薄茶、上部につばの痕跡"],
   lookalike:"ニセマツタケ：香りが弱く苦みがある",
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Matsutake_2009.jpg/480px-Matsutake_2009.jpg"},

  {id:"nameko",name:"ナメコ",sci:"Pholiota nameko",
   danger:"食用不明",season:["秋"],
   desc:"全体が透明なゼラチン質の粘液で覆われた小型のきのこ。ブナ・ミズナラの枯れ木に群生。天然品は栽培品より香りが強い。",
   id_pts:["傘・柄全体を透明な粘液が覆う（最大の特徴）","傘は橙褐色〜茶色、小型（2〜8cm）","広葉樹の枯れ木に密に群生","ひだは黄白色のち茶色に変化"],
   lookalike:"コレラタケ（猛毒）：粘液が少なく、つばが明確で暗い色",
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Pholiota_nameko_2012-10-29_01.jpg/480px-Pholiota_nameko_2012-10-29_01.jpg"},

  {id:"shiitake",name:"シイタケ",sci:"Lentinula edodes",
   danger:"食用不明",season:["春","秋"],
   desc:"最もポピュラーな食用きのこ。クヌギ・コナラの枯れ木に発生。天然品は栽培品より香りが数段強い。",
   id_pts:["傘は茶褐色〜暗褐色、表面に白い亀裂が入ることが多い","幼菌時は傘の縁が内側に強く巻く","ひだは白色、傷つくと赤褐色に変色","広葉樹の枯れ木のみに発生（地上には生えない）"],

  {id:"enokitake",name:"エノキタケ",sci:"Flammulina velutipes",
   danger:"食用不明",season:["冬"],
   desc:"スーパーの白いもやし状とは全く別物。野生品は茶褐色で柄が黒いビロード状。冬の寒い時期に枯れ木に群生。",

  {id:"chichitake",name:"チチタケ",sci:"Lactarius volemus",
   danger:"食用不明",season:["夏","秋"],
   desc:"栃木県で特に珍重される郷土食材。傷つけると大量の白い乳液が出るのが最大の特徴。乾燥するとうま味が増す。",

  {id:"tamagotake",name:"タマゴタケ",sci:"Amanita caesareoides",

   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Tricholoma_terreum_crop.jpg/480px-Tricholoma_terreum_crop.jpg"},

  {id:"fuyu-kikurage",name:"タマキクラゲ",sci:"Exidia glandulosa",
   danger:"食用不明",season:["冬","春"],
   desc:"冬〜春にかけて広葉樹の枯れ木に発生する黒いゼラチン質のきのこ。キクラゲに似るが球状〜不整形に固まる点が異なる。",
   id_pts:["黒〜暗褐色の球状〜脳状のゼラチン質","広葉樹の枯れ枝・倒木に発生","乾燥すると黒く薄くなる（水で戻ると復元）","直径0.5〜3cmの小塊が集まる"],
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4c/Exidia_glandulosa_crop.jpg/480px-Exidia_glandulosa_crop.jpg"},

  {id:"fuyu-take3",name:"ヒイロタケ",sci:"Pycnoporus cinnabarinus",
   danger:"食用不明",season:["夏","秋","冬"],
   desc:"鮮やかな朱赤色が特徴の木材腐朽菌。広葉樹の枯れ木に発生し、硬くて食用には向かない。薬用成分の研究が進んでいる。",
   id_pts:["半円形〜扇形、鮮やかな朱赤色〜橙赤色（非常に目立つ）","裏面も朱赤色の細かい管孔","硬くてコルク質","広葉樹の枯れ木・倒木に発生"],
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/Pycnoporus_cinnabarinus_crop.jpg/480px-Pycnoporus_cinnabarinus_crop.jpg"},

  {id:"fuyu-namerako",name:"ムキタケ",sci:"Sarcomyxa serotina",
   danger:"食用不明",season:["秋","冬"],
   desc:"晩秋〜冬に広葉樹の枯れ木に発生する食用きのこ。傘の皮が簡単にむけることが名の由来。寒い時期のきのことして人気が高い。",
   id_pts:["傘は緑褐色〜黄褐色〜橙褐色（変異大）","傘の皮が簡単にむける（最大の特徴）","広葉樹の枯れ木・倒木に重なって発生","ひだは白〜淡黄色で密"],
   lookalike:"ツキヨタケ（毒）：より橙褐色で暗闇でひだが光る、柄基部に黒い染みあり",
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Sarcomyxa_serotina_crop.jpg/480px-Sarcomyxa_serotina_crop.jpg"},

  {id:"fuyu-take4",name:"エノキツムタケ",sci:"Flammulina fennae",
   danger:"食用不明",season:["冬"],
   desc:"エノキタケの近縁種。北欧から記載された種で日本でも確認されている。エノキタケと見分けが難しいが食用とされる。",
   id_pts:["エノキタケに非常に似た外観","傘の粘性がエノキタケより少ない傾向","冬の広葉樹枯れ木に発生","柄下部のビロード状の毛がやや短い"],
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Flammulina_velutipes_2012-11-17_01.jpg/480px-Flammulina_velutipes_2012-11-17_01.jpg"},

  {id:"fuyu-take5",name:"ブナハリタケ",sci:"Mycoleptodonoides aitchisonii",
   danger:"食用不明",season:["秋","冬"],
   desc:"ブナ・ミズナラの枯れ木に発生する白い食用きのこ。傘の裏面に細かい針（歯）が密生する。歯ごたえがありだし汁が出やすい。",
   id_pts:["傘は白〜クリーム色の半円形〜扇形","裏面に白〜淡黄色の細かい針（歯牙）が密生","ブナ・ミズナラの枯れ木に発生","晩秋〜冬にも発生し続ける"],
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/10/Mycoleptodonoides_aitchisonii.jpg/480px-Mycoleptodonoides_aitchisonii.jpg"},

  {id:"fuyu-take6",name:"キクラゲ（冬型）",sci:"Auricularia auricula-judae",
   danger:"食用不明",season:["冬"],
   desc:"キクラゲは冬でも温暖な地域では発生し続ける。凍結しても解凍すれば食用可能。乾燥保存が効き通年利用できる。",
   id_pts:["耳形〜波打った不整形のゼラチン質","冬でも発生（耐寒性が高い）","広葉樹（ニワトコ・ケヤキ）の枯れ木","乾燥・凍結からも復活する"],
   img:"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Auricularia_auricula.jpg/480px-Auricularia_auricula.jpg"}
];

const SN = {春:"🌸",夏:"🌿",秋:"🍂",冬:"❄️"};
const DL = {"毒":"☠️ 毒","毒の疑い":"⚠️ 毒の疑い","食用不明":"❓ 食用不明"};

// ─── State ──────────────────────────────────────────────────────────────────
const st = { q:"", s:"all", d:"all", open:null };

// ─── Filter ─────────────────────────────────────────────────────────────────
function filtered() {
  return DATA.filter(m => {
    if (st.q && !m.name.includes(st.q)) return false;
    if (st.s !== "all" && !m.season.includes(st.s)) return false;
    if (st.d !== "all" && m.danger !== st.d) return false;
    return true;
  });
}

// ─── Photo helper ────────────────────────────────────────────────────────────
const DANGER_BG = { "毒":"#c0392b", "毒の疑い":"#c06010", "食用不明":"#4a7a4a" };

function cardPhoto(m) {
  if (!m.img) {
    const initial = m.name.charAt(0);
    const bg = DANGER_BG[m.danger] || "#4a7a4a";
    return `<div class="card-photo-ph" style="background:${bg}20;border-color:${bg}40;color:${bg}">
      <span style="font-size:22px;font-weight:900">${initial}</span></div>`;
  }
  return `<img class="card-photo" src="${m.img}" alt="${m.name}" loading="lazy"
    onerror="this.outerHTML='<div class=\\'card-photo-ph\\' style=\\'background:${DANGER_BG[m.danger]}20;border:1px solid ${DANGER_BG[m.danger]}40;color:${DANGER_BG[m.danger]}\\'><span style=\\'font-size:22px;font-weight:900\\'>${m.name.charAt(0)}</span></div>'">`;
}

// ─── Render list ─────────────────────────────────────────────────────────────
function renderList() {
  const items = filtered();
  document.getElementById("count").textContent = `${items.length} 種`;
  const body = document.getElementById("list-body");
  if (!items.length) {
    body.innerHTML = `<div class="empty"><div class="empty-ico">🌫️</div><div class="empty-txt">見つかりませんでした</div></div>`;
    return;
  }

  // カードの背景を毒性に応じて微妙に色付け
  const CARD_BG = { "毒":"#fff8f8", "毒の疑い":"#fffaf5", "食用不明":"#f8fbf8" };

  body.innerHTML = items.map(m => {
    const stags = m.season.map(s => `<span class="tag tag-season">${SN[s]||""}${s}</span>`).join("");
    const accentColor = DANGER_BG[m.danger] || "#7aaa7a";
    const cardBg = CARD_BG[m.danger] || "#f8fbf8";
    return `<div class="card" data-id="${m.id}" tabindex="0" role="button" aria-label="${m.name}を見る"
        style="background:${cardBg}">
      <span class="card-accent card-accent-${m.danger}" style="background:${accentColor}"></span>
      ${cardPhoto(m)}
      <div class="card-info">
        <div class="card-name">${m.name}</div>
        ${m.sci ? `<div class="card-sci">${m.sci}</div>` : ""}
        <div class="card-tags">
          <span class="tag tag-${m.danger}">${DL[m.danger]}</span>
          ${stags}
        </div>
      </div>
      <svg style="flex-shrink:0;color:#ccc;margin-right:10px" width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>`;
  }).join("");

  body.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openDetail(el.dataset.id));
    el.addEventListener("keydown", e => { if (e.key === "Enter") openDetail(el.dataset.id); });
  });
}

// ─── Render detail ───────────────────────────────────────────────────────────
function openDetail(id) {
  const m = DATA.find(x => x.id === id);
  if (!m) return;
  st.open = id;
  document.getElementById("dt-hd-name").textContent = m.name;

  // ヒーロー画像
  const heroHtml = m.img
    ? `<img class="dt-hero" src="${m.img}" alt="${m.name}" onerror="this.outerHTML='<div class=\\'dt-hero-ph\\'>${m.name.charAt(0)}</div>'">`
    : `<div class="dt-hero-ph" style="font-size:64px;font-weight:900;color:${DANGER_BG[m.danger]}40">${m.name.charAt(0)}</div>`;

  // 毒性バナー
  const BANNER_STYLE = {
    "毒":      "background:#fdecea;border-left:4px solid #b82020;color:#b82020",
    "毒の疑い": "background:#fef6ee;border-left:4px solid #c06010;color:#c06010",
    "食用不明": "background:#eef4ee;border-left:4px solid #4a7a4a;color:#4a7a4a"
  };
  const BANNER_TEXT = {
    "毒":      "☠️ この種は毒を持ちます。絶対に食べないでください。",
    "毒の疑い": "⚠️ 毒性の疑いがあります。食べないことを強く推奨します。",
    "食用不明": "❓ 食毒不明または要注意。専門家の確認なしに食べないでください。"
  };
  const banner = `<div style="margin:0 0 18px;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;line-height:1.5;${BANNER_STYLE[m.danger]}">${BANNER_TEXT[m.danger]}</div>`;

  const stags = m.season.map(s =>
    `<span class="dt-tag tag-season">${SN[s]||""}${s}</span>`).join("");

  const checkHtml = (m.id_pts || []).map(pt => `
    <li>
      <span class="chk"><svg viewBox="0 0 10 10"><polyline points="1.5 5 4 7.5 8.5 2.5"/></svg></span>
      <span>${pt}</span>
    </li>`).join("");

  const alerts = [
    m.lookalike ? `<div class="alert alert-warn">
      <span class="alert-lbl">⚠️ 似ているきのこ・混同注意</span>${m.lookalike}</div>` : "",
    m.warn ? `<div class="alert alert-toxic">
      <span class="alert-lbl">🚨 注意・毒性</span>${m.warn}</div>` : ""
  ].filter(Boolean).join("");

  document.getElementById("dt-scroll").innerHTML = `
    ${heroHtml}
    <div class="dt-body">
      <div class="dt-name">${m.name}</div>
      ${m.sci ? `<div class="dt-sci">${m.sci}</div>` : ""}
      <div class="dt-tags">
        <span class="dt-tag tag-${m.danger}">${DL[m.danger]}</span>
        ${stags}
      </div>
      ${banner}
      <div class="sec">
        <div class="sec-ttl">📖 説明</div>
        <div class="sec-body">${m.desc}</div>
      </div>
      ${checkHtml ? `<div class="sec">
        <div class="sec-ttl">🔍 現物確認ポイント</div>
        <ul class="check-ul">${checkHtml}</ul>
      </div>` : ""}
      ${alerts ? `<div class="sec">
        <div class="sec-ttl">⚠️ 注意事項</div>
        ${alerts}
      </div>` : ""}
      <p style="font-size:11px;color:#bbb;margin-top:20px;text-align:right;padding-bottom:8px">
        📷 画像: Wikimedia Commons (CC)</p>
    </div>`;

  document.getElementById("dt-scroll").scrollTop = 0;
  const panel = document.getElementById("detail");
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  history.pushState({ detail: id }, "", `#${id}`);
}

function closeDetail() {
  document.getElementById("detail").classList.remove("open");
  document.getElementById("detail").setAttribute("aria-hidden", "true");
  st.open = null;
  if (history.state?.detail) history.back();
}

// ─── Events ──────────────────────────────────────────────────────────────────
document.getElementById("back-btn").addEventListener("click", closeDetail);
window.addEventListener("popstate", () => { if (st.open) closeDetail(); });

// Search
const qi = document.getElementById("q");
const qx = document.getElementById("qx");
qi.addEventListener("input", () => {
  st.q = qi.value;
  qx.classList.toggle("on", st.q.length > 0);
  renderList();
});
qx.addEventListener("click", () => {
  qi.value = ""; st.q = "";
  qx.classList.remove("on");
  qi.focus(); renderList();
});

// Season chips
document.getElementById("season-row").addEventListener("click", e => {
  const b = e.target.closest("[data-s]");
  if (!b) return;
  st.s = b.dataset.s;
  document.querySelectorAll("[data-s]").forEach(x =>
    x.classList.toggle("on-s", x.dataset.s === st.s));
  renderList();
});

// Danger chips
document.getElementById("danger-row").addEventListener("click", e => {
  const b = e.target.closest("[data-d]");
  if (!b) return;
  st.d = b.dataset.d;
  document.querySelectorAll("[data-d]").forEach(x => {
    x.classList.remove("on-d0","on-d1","on-d2","on-d3");
    if (x.dataset.d === st.d) {
      const cls = {all:"on-d0","毒":"on-d1","毒の疑い":"on-d2","食用不明":"on-d3"}[st.d];
      if (cls) x.classList.add(cls);
    }
  });
  renderList();
});

// Swipe back (touch)
let tx0 = 0;
const dtPanel = document.getElementById("detail");
dtPanel.addEventListener("touchstart", e => { tx0 = e.touches[0].clientX; }, { passive: true });
dtPanel.addEventListener("touchend", e => {
  if (e.changedTouches[0].clientX - tx0 > 72) closeDetail();
}, { passive: true });

// ─── Init ────────────────────────────────────────────────────────────────────
renderList();
if (location.hash) {
  const id = location.hash.slice(1);
  if (DATA.find(m => m.id === id)) openDetail(id);
}
</script>
</body>
</html>
